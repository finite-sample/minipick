[project]
name = "minipick"
description = "Sampling with certified minimax risk bounds"
readme = "README.md"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2", "cvxpy>=1.7", "clarabel>=0.11"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minipick"]

[tool.hatch.build.targets.sdist]
include = ["src/", "pyproject.toml", "README.md", "LICENSE"]

[project.urls]
Repository = "https://github.com/finite-sample/minipick"

[tool.pytest.ini_options]
testpaths = ["tests"]
